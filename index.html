<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Practice 5</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<body>
    <div>
        <form>
            <label form="category">Select a product category:</label>
            <br>
            <select id="category" name="category" required>
                <option value="">Select a product</option>
                <option value="Beverage">Beverage</option>
                <option value="Food">Food</option>
                <option value="Clothing">Clothing</option>
                <option value="Electronics">Electronics</option>
            </select>
            <br>

            <label form="product">Type a product:</label>
            <br>
            <input type="text" id="product" name="product" placeholder="Enter a product" required>
            <br>

            <label form="stock">Stock Quantity:</label>
            <br>
            <input type="number" id="stock" name="stock" placeholder="Enter stock quantity" required>
            <br>

            <button type="button" py-click="display_char" id="btn">Generate SKU</button>
        </form>

        <div id="output1">
        <script type="py" src="main.py"></script>
    </div>
</body>
</html>
