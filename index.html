<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Practice 5</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
    body {
        font-family: Arial;
        background-color: lightblue;
        text-align: center;
    }

    .container {
        background-color: white;
        width: 450px;
        margin: 50px auto;
        padding: 30px;
        border: 2px solid #3480b3;
    }

    .box {
        border: 1px solid #3480b3;
        margin: 15px;
        padding: 15px;
    }

    h1 {
        color: #3480b3;
    }

    label {
        color: #b33434;
        font-weight: bold;
    }

    input, select {
        width: 250px;
        padding: 8px;
        margin-top: 8px;
    }

    button {
        background-color: #3480b3;
        color: white;
        border: none;
        padding: 10px 20px;
        margin: 10px;
    }

    #output1 {
        font-weight: bold;
    }
</style>

</head>
<body>
    <div class="container">
        <h1>SKU Generator</h1>
        <form>
            <label form="category">Select a product category:</label>
            <br>
            <select id="category" name="category" required>
                <option value="">Select a product</option>
                <option value="Beverage">Beverage</option>
                <option value="Food">Food</option>
                <option value="Clothing">Clothing</option>
                <option value="Electronics">Electronics</option>
            </select>
            <br>

            <label form="product">Type a product:</label>
            <br>
            <input type="text" id="product" name="product" placeholder="Enter a product" required>
            <br>

            <label form="stock">Stock Quantity:</label>
            <br>
            <input type="number" id="stock" name="stock" placeholder="Enter stock quantity" required>
            <br>

            <button type="button" py-click="display_char" id="btn">Generate SKU</button>
        </form>

        <div id="output1">
        <script type="py" src="main.py"></script>
    </div>
</body>
</html>
